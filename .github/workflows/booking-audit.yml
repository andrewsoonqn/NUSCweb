name: Booking audit integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  booking-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nusc_booking_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOOKING_AUDIT_TEST_EXTERNAL: '1'
      BOOKING_AUDIT_TEST_EXPECTED_DATABASE: nusc_booking_audit
      BOOKING_AUDIT_TEST_GUARD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusc_booking_audit
      BOOKING_AUDIT_TEST_SYSTEM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusc_booking_audit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash tests/booking-audit-runner-safety.test.sh
      - run: pnpm test:booking-audit
